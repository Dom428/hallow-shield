# Hallow Shield: tests the converter, runs the real extension in Chromium against test pages, then builds the rules from
# the newest EasyList and EasyPrivacy, checks Chromium loads them and blocks real ad servers, and packs the zips.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # every Monday: fresh lists

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Converter tests
        run: npm test
      - name: The extension in Chromium (sample rules)
        run: npm run rules:sample && npm run e2e
      - name: Rules from the newest EasyList and EasyPrivacy
        run: npm run rules
      - name: Chromium loads the real rules and blocks real ad servers
        run: node test/smoke-real.mjs
      - name: Pack for Chrome / Edge / Brave / Opera and Firefox
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: hallow-shield
          path: |
            dist/*.zip
            extension/rules/meta.json
          retention-days: 30
