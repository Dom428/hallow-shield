# Hallow Shield: tests the converter, scriptlets, cookie-banner clicker, stats and per-site modes, runs the real
# extension in Chromium against test pages (sample
# lists), then builds the rules from the newest lists (uBlock filters, EasyList, EasyPrivacy, Peter Lowe,
# the cookie-notice and annoyance lists), has Chromium
# check every regex, checks the real rules load, block real ad servers and fix a fake YouTube page, measures what
# Shield costs a heavy page (load time and content-script time, with the real rules; fails over budget), packs the
# zips, and lints the Firefox package.
# 1.6: a Windows job builds the Hallow family bridge (bridge/HallowShieldBridge.exe, .NET Framework csc), runs its unit
# tests and the bridge end-to-end test with the real exe; the Linux job runs the same e2e against a stand-in host and
# packs the Windows-built exe into both zips.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # every Monday: fresh lists

permissions:
  contents: read

jobs:
  bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the bridge and run its unit tests (framing, merging, atomic write, stale entries, register)
        shell: powershell
        run: .\bridge\build.ps1 -Test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install chromium
      - name: Bridge end-to-end (the switch, a native message to the real exe, status.json with counts and no URLs)
        run: npm run rules:sample && npm run e2e:bridge
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-exe
          path: bridge/HallowShieldBridge.exe
          retention-days: 30
  build:
    needs: bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Converter and scriptlet tests
        run: npm test
      - name: The extension in Chromium (sample lists)
        run: npm run rules:sample && npm run e2e
      - name: The Hallow family bridge in Chromium (stand-in host)
        run: npm run e2e:bridge
      - name: Rules from the newest lists
        run: npm run rules
      - name: Chromium checks every regex rule
        run: npm run regex
      - name: Explain doubleclick gpt.js
        run: node tools/explain.mjs http://securepubads.g.doubleclick.net/tag/js/gpt.js http://news.example.org/page script
      - name: Chromium loads the real rules, blocks real ad servers, real YouTube filters on a fake page
        run: npm run smoke
      - name: Performance budget (heavy page with and without Shield, real rules)
        run: npm run perf
      - uses: actions/download-artifact@v4
        with:
          name: bridge-exe
          path: bridge
      - name: Pack for Chrome / Edge / Brave / Opera and Firefox
        run: npm run package
      - name: Each zip carries version.json
        run: |
          for z in dist/hallow-shield-*.zip; do unzip -p "$z" version.json | tee /dev/stderr | node -e "const v=JSON.parse(require('fs').readFileSync(0,'utf8')); const m=require('./extension/manifest.json'); if (v.version!==m.version||v.dev!==false||!v.built) process.exit(1)"; done
      - name: Each zip carries the bridge and its install script
        run: |
          for z in dist/hallow-shield-*.zip; do unzip -l "$z" | grep -q 'bridge/HallowShieldBridge.exe' && unzip -l "$z" | grep -q 'bridge/install-bridge.ps1' || exit 1; done
          unzip -p dist/hallow-shield-chrome-*.zip manifest.json | node -e "const m=JSON.parse(require('fs').readFileSync(0,'utf8')); if(!m.key) process.exit(1)"
          unzip -p dist/hallow-shield-firefox-*.zip manifest.json | node -e "const m=JSON.parse(require('fs').readFileSync(0,'utf8')); if(m.key) process.exit(1)"
      - name: Lint the Firefox package (addons-linter)
        continue-on-error: true
        run: |
          mkdir -p dist/ff && cd dist/ff && unzip -q ../hallow-shield-firefox-*.zip
          npx --yes web-ext@8 lint --source-dir . --self-hosted --output text
      - uses: actions/upload-artifact@v4
        with:
          name: hallow-shield
          path: |
            dist/*.zip
            extension/rules/meta.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shield-screens
          path: |
            /tmp/shield-*.png
            /tmp/shield-perf.json
          if-no-files-found: ignore
          retention-days: 7
